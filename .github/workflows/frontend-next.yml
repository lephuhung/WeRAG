name: Frontend Next

on:
  push:
    branches: [main]
    paths:
      - "frontend-next/**"
      - ".github/workflows/frontend-next.yml"
  pull_request:
    paths:
      - "frontend-next/**"
      - ".github/workflows/frontend-next.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          # next.config.ts refuses a production build without it.
          WERAG_BACKEND_URL: http://127.0.0.1:8080
        run: npm run build
