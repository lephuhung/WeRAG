# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.
# `enabled: false` hides an agent from the agent picker (web and Word add-in)
# while keeping it resolvable by ID for existing sessions and API callers.
# Absent means enabled.

builtin_agents:
  - id: "builtin-quick-answer"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Quick Answer"
        description: "Knowledge base RAG Q&A for fast and accurate answers"
      vi:
        name: "Hỏi đáp nhanh"
        description: "Hỏi đáp RAG trên kho tri thức, trả lời nhanh và chính xác"
    config:
      agent_mode: "quick-answer"
      system_prompt_id: "default_kb"
      context_template_id: "default_context"
      temperature: 0.7
      max_completion_tokens: 0
      web_search_enabled: true
      web_search_max_results: 5
      multi_turn_enabled: true
      history_turns: 5
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      enable_query_expansion: true
      enable_rewrite: true
      fallback_strategy: "model"

  - id: "builtin-smart-reasoning"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Smart Reasoning"
        description: "ReAct reasoning framework with multi-step thinking and tool calling"
      vi:
        name: "Suy luận thông minh"
        description: "Khung suy luận ReAct, hỗ trợ suy nghĩ nhiều bước và gọi công cụ"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "rag-qa"
      system_prompt: ""
      temperature: 0.7
      max_completion_tokens: 0
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        - "search_knowledge"
        - "read_document"
        - "list_documents"
        - "query_knowledge_graph"
        # Wiki pages are a lookup aid (catalogue overview, relations); the
        # engine drops these when no KB in scope has a wiki, and appends a
        # "verify against the source" reminder to answers that used them.
        - "wiki_search"
        - "wiki_read_page"
      web_search_enabled: true
      web_search_max_results: 5
      reflection_enabled: false
      multi_turn_enabled: true
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-data-analyst"
    enabled: false
    avatar: "📊"
    is_builtin: true
    i18n:
      default:
        name: "Data Analyst"
        description: "Professional data analysis agent with SQL query and statistical analysis for CSV/Excel files"
      vi:
        name: "Phân tích dữ liệu"
        description: "Trợ lý phân tích dữ liệu: truy vấn SQL và thống kê trên tệp CSV/Excel"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "data-analysis"
      system_prompt_id: "data_analyst"
      temperature: 0.3
      max_completion_tokens: 0
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      supported_file_types:
        - "csv"
        - "xlsx"
      allowed_tools:
        - "data_schema"
        - "data_analysis"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: true
      multi_turn_enabled: true
      embedding_top_k: 5
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 5
      rerank_threshold: 0.3

  - id: "builtin-wiki-researcher"
    enabled: false
    avatar: "📚"
    is_builtin: true
    i18n:
      default:
        name: "Wiki Questioner"
        description: "Specialized agent for answering questions based on Wiki knowledge bases"
      vi:
        name: "Hỏi đáp Wiki"
        description: "Trợ lý chuyên trả lời câu hỏi dựa trên kho tri thức Wiki"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "wiki-qa"
      system_prompt_id: "wiki_researcher"
      temperature: 0.7
      max_completion_tokens: 0
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        - "wiki_search"
        - "wiki_read_page"
        - "read_document"
        - "wiki_flag_issue"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-document-assistant"
    avatar: "📝"
    is_builtin: true
    i18n:
      default:
        name: "Document Assistant"
        description: "Edit a Word document in place: normalise its layout to Decree 30/2020, rewrite highlighted passages, cite the legal basis"
      vi:
        name: "Soạn thảo văn bản"
        description: "Chỉnh sửa tài liệu Word ngay trên trình soạn thảo: chuẩn hóa thể thức theo Nghị định 30/2020, viết lại đoạn đã bôi đen, tra cứu căn cứ pháp lý"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "document_assistant"
      temperature: 0.2
      max_completion_tokens: 0
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      # Matches the Word add-in attach picker (ATTACH_ACCEPT): office text,
      # PDF (scanned pages OCR'd by docreader's vietnamese_legal engine) and
      # images (OCR'd through vlm_model_id when the deployment sets one).
      supported_file_types:
        - "docx"
        - "doc"
        - "pdf"
        - "txt"
        - "md"
        - "jpg"
        - "jpeg"
        - "png"
        - "gif"
        - "webp"
      image_upload_enabled: true
      attachment_image_understanding: true
      allowed_tools:
        - "check_document_format"
        - "read_document_outline"
        - "apply_format_fixes"
        - "rewrite_paragraphs"
        - "insert_paragraphs"
        - "mark_passages"
        - "check_spelling"
        - "draw_diagram"
        - "generate_illustration"
        - "search_knowledge"
        - "read_document"
        - "query_knowledge_graph"
        - "wiki_search"
        - "wiki_read_page"
        - "resolve_abbreviation"
      web_search_enabled: true
      web_search_max_results: 5
      # Document assistant components. Empty model ids use model_id.
      format_check_model_id: ""
      format_check_on_open: true
      ask_scope_for_long_documents: true
      spellcheck_model_id: "builtin-llm-spellcheck"
      # MCP service generate_illustration paints with; empty = the first
      # enabled service offering generate_image (e.g. Qwen-Image).
      illustration_mcp_service_id: ""
      web_search_default_on: true
      reflection_enabled: false
      multi_turn_enabled: true
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-wiki-fixer"
    avatar: "🔧"
    is_builtin: true
    i18n:
      default:
        name: "Wiki Fixer"
        description: "Specialized agent for revising Wiki pages based on inspection issues"
      vi:
        name: "Hiệu đính Wiki"
        description: "Trợ lý chuyên sửa trang Wiki theo các vấn đề phát hiện khi kiểm tra"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "wiki_fixer"
      temperature: 0.7
      max_completion_tokens: 0
      max_iterations: 30
      kb_selection_mode: "selected"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: true
      allowed_tools:
        - "wiki_search"
        - "wiki_read_page"
        - "read_document"
        - "wiki_write_page"
        - "wiki_replace_text"
        - "wiki_rename_page"
        - "wiki_delete_page"
        - "wiki_read_issue"
        - "wiki_update_issue"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-skill-installer"
    avatar: "📦"
    is_builtin: true
    i18n:
      default:
        name: "Skill Installer"
        description: "Internal agent that installs an uploaded skill and its dependencies into the sandbox image"
      vi:
        name: "Cài đặt kỹ năng"
        description: "Trợ lý nội bộ cài kỹ năng đã tải lên cùng các phụ thuộc vào ảnh sandbox"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "skill_installer"
      temperature: 0.2
      max_completion_tokens: 24576
      max_iterations: 30
      kb_selection_mode: "none"
      retrieve_kb_only_when_mentioned: false
      # The install path unions these three in regardless of what is written
      # here: an install that cannot write its own skill directory cannot
      # record what it did. They are listed for accuracy, not as the source of
      # truth. write_skill_file / edit_skill_file reach only the one skill
      # being installed and are never offered to a tenant-editable agent.
      allowed_tools:
        - "shell_exec"
        - "write_skill_file"
        - "edit_skill_file"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true

