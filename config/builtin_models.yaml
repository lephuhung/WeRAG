builtin_models:
  - id: builtin-llm-default
    type: KnowledgeQA
    source: remote
    is_default: true
    name: ${LLM_MODEL_NAME:-gpt-4o-mini}
    parameters:
      # Defaults resolve to OpenAI's public endpoint; override via .env
      # (LLM_BASE_URL / LLM_MODEL_NAME / LLM_PROVIDER). Only LLM_API_KEY has
      # no default — a chat request without it fails upstream auth.
      base_url: ${LLM_BASE_URL:-api.openai.com/v1}
      api_key: ${LLM_API_KEY}
      provider: ${LLM_PROVIDER:-openai}
      context_window: 128000

  # Vietnamese spell-check model (Gemma-4-E4B-it + LoRA v4 since 2026-10-15, training/spellcheck).
  # Served by vLLM on 10.10.0.240:8001 (moved from .241:8003 on 2026-10-15); point check_spelling at it via
  # spellcheck_model_id in builtin_agents.yaml.
  - id: builtin-llm-spellcheck
    type: KnowledgeQA
    source: remote
    is_default: false
    name: ${SPELLCHECK_MODEL_NAME:-spellcheck-gemma4-e4b-v4}
    description: Gemma-4-E4B fine-tuned for Vietnamese spelling review
    parameters:
      base_url: ${SPELLCHECK_BASE_URL:-http://10.10.0.240:8001/v1}
      api_key: ${SPELLCHECK_API_KEY:-none}
      provider: generic
      context_window: 32000

  # The same vLLM container serves the base Gemma-4-E4B-it without the
  # spelling LoRA, for general tasks (format check, wiki): one copy of the
  # weights, the model name picks LoRA or not per request.
  - id: builtin-llm-gemma4-e4b
    type: KnowledgeQA
    source: remote
    is_default: false
    name: ${GEMMA_E4B_MODEL_NAME:-gemma-4-e4b-it}
    description: Gemma-4-E4B-it base (local vLLM, shares the spellcheck container)
    parameters:
      base_url: ${GEMMA_E4B_BASE_URL:-http://10.10.0.240:8001/v1}
      api_key: ${GEMMA_E4B_API_KEY:-none}
      provider: generic
      context_window: 32768   # vLLM max-model-len on 10.10.0.240:8001 (shares the card with the 35B)
