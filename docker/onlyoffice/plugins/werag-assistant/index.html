<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>WeRAG Assistant</title>
    <!-- Served by the Document Server itself (sdkjs-plugins/v1/), exactly like
         the plugins bundled with DS — no request to onlyoffice.github.io, so
         this works fully offline. -->
    <script type="text/javascript" src="../v1/plugins.js"></script>
    <!-- DS's nginx serves sdkjs-plugins/ as "immutable, max-age 1 year", so
         the browser keeps THIS file and never asks again: a ?v= bump here
         never reaches it. plugin.js is therefore loaded with a fresh query on
         every editor start (document.write keeps it synchronous, before
         plugins.js calls init). Do not edit this file again unless users
         are told to clear the editor's cache — see README "Caching". -->
    <script type="text/javascript">
        document.write('<script type="text/javascript" src="plugin.js?t=' + Date.now() + '"><\/script>');
    </script>
</head>
<body></body>
</html>
