    post:
      consumes:
      - multipart/form-data
      description: |-
        Multipart upload: file (.docx), optional document_type
        (auto by default), scope (auto | full | technical |
        attached: documents outside the 29 văn bản hành chính get
        the technical layout checks only), segmenter (auto | heuristic) and
        evaluate=true (judge the format data against the document-type
        skills with the organization chat model, thinking on; ~1 min).
        Returns every rule with pass/fail/warn/skip, the measured
        value, the offending lines, the format data and, with
        evaluate, the written evaluation.
      parameters:
      - description: .docx file
        in: formData
        name: file
        required: true
        type: file
      - description: rule set, e.g. cong_van
        in: formData
        name: document_type
        type: string
      - description: auto | heuristic
        in: formData
        name: segmenter
        type: string
      - description: auto | full | technical | attached (auto by default; a named
          document_type of a văn bản hành chính is checked in full)
        in: formData
        name: scope
        type: string
      - description: skill evaluation (thinking)
        in: formData
        name: evaluate
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Check the thể thức of a .docx (NĐ30/2020)
      tags:
      - Thể thức văn bản
