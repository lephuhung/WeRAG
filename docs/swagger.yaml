        or platform public KB to target_tenant_id without widening its scope: restricted
        stays restricted (only the target''s Admins and SuperAdmins read it until
        the target shares it), tenant stays tenant, published is withdrawn to tenant
        (withdrawn_from_published=true), platform public becomes tenant. Data-scope
        tenant_id and member_default are kept; every invitation and tenant grant is
        revoked (revoked_reason owner_changed).'
