        type: string
      name:
        type: string
      service_id:
        description: Parent MCP service for MCP tool mentions
        type: string
      skill_name:
        description: Preloaded agent skill name
        type: string
      type:
        description: '"kb", "file", "tag", "mcp", "skill", "document"'
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.Message:
    properties:
      abbreviation:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.AbbreviationPublicState'
        description: |-
          Abbreviation carries the public clarification state linked to this
          message by the abbreviation-resolution gate (root question, definition
          reply, clarification or answer). Hydrated by the message repository at
          read time from live turn rows — never persisted on the message itself —
          and projects only AbbreviationPublicState fields: no owner, principal,
          snapshot or definition spans.
      agent_duration_ms:
        description: Agent total execution duration in milliseconds (from query start
          to answer start)
        type: integer
      agent_id:
        description: |-
          AgentID is the agent used for this individual assistant turn. Unlike the
          session's last_request_state it remains stable when users switch agents.
        type: string
      agent_steps:
        description: |-
          Agent execution steps (only for assistant messages generated by agent)
          This contains the detailed reasoning process and tool calls made by the agent
          Stored for user history display, but NOT included in LLM context to avoid redundancy
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.AgentStep'
        type: array
      artifacts:
        description: |-
          Skill-generated files produced during this assistant turn (assistant messages only).
          Populated by ArtifactCollector after the sandbox finishes, referenced by the
          artifact download endpoint. Empty for user messages and turns without skills.

          Stored in the message_artifacts table, not on the message row: the message
          repository loads it with every message it returns and writes it whenever it
          is non-nil on create or update. A nil slice leaves the stored rows alone.
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MessageArtifact'
        type: array
      attachments:
        description: Attached files (documents, audio, etc., for user messages)
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MessageAttachment'
        type: array
      channel:
        description: Channel indicates the source channel of this message (e.g., "web",
          "api", "im")
        type: string
      content:
        description: Message text content
        type: string
      context_compacted:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.ContextCompactedMarker'
        description: |-
          ContextCompacted is the chat UI's view of ContextCheckpoint, filled on
          read (AfterFind): it marks the turn up to which earlier conversation
          was summarized, so the compaction marker survives a reload.
      created_at:
        description: Message creation timestamp
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Soft delete timestamp
      document_selection:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MessageDocumentSelection'
        description: |-
          Editor passage the user highlighted in the embedded document editor when
          sending this message (user messages only), so history shows which
          passage the question referred to.
      feedback:
        description: |-
          Feedback is the session owner's judgement of an assistant answer:
          MessageFeedbackUp, MessageFeedbackDown or 0 when none was given. It is
          mirrored to Langfuse as the "user-feedback" score on the turn's trace.
        type: integer
      feedback_at:
        type: string
      feedback_comment:
        type: string
      id:
        description: Unique identifier for the message
        type: string
      images:
        description: Attached images with OCR/Caption text (for user messages)
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MessageImage'
        type: array
      is_completed:
        description: Whether message generation is complete
        type: boolean
      is_fallback:
        description: Whether this response is a fallback (no knowledge base match
          found)
        type: boolean
      knowledge_id:
        description: |-
          KnowledgeID links this message to a Knowledge entry in the chat history knowledge base
          Used for vector search indexing: when set, the message content has been indexed as a Knowledge passage
        type: string
      knowledge_references:
        description: References to knowledge chunks used in the response
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SearchResult'
        type: array
      mentioned_items:
        description: |-
          Mentioned knowledge bases and files (for user messages)
          Stores the @mentioned items when user sends a message
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MentionedItem'
        type: array
      model_id:
        description: |-
          ModelID is the requested/effective chat model binding captured for this
          turn. It is useful for reproducibility and suggestion generation.
        type: string
      request_id:
        description: Request identifier for tracking API requests
        type: string
      role:
        description: 'Message role: "user", "assistant", "system"'
        type: string
      sandbox_checkpoint:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SandboxCheckpoint'
        description: |-
          SandboxCheckpoint is the git commit this assistant turn produced in the
          session sandbox's /workspace. Nil for user messages, for turns that ran
          without a sandbox, and for turns whose commit failed (best-effort — a
          failed checkpoint must never block the reply). A message without a
          checkpoint cannot serve as a fork point with sandbox state.
      session_id:
        description: ID of the session this message belongs to
        type: string
      updated_at:
        description: Last update timestamp
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TokenUsage'
        description: |-
          LLM token usage aggregated across every round of the turn that produced this
          assistant message. Persisted so history reads can attribute cost after the
          live stream is gone; NULL (nil) for user messages and pre-feature rows.
      used_memories:
        description: |-
          UsedMemories records which long-term memories were injected into this
          answer, so the chat UI can show them and let the user delete one on the
          spot. Persisted rather than only streamed so reopening a conversation
          still explains what the answer saw.
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.UsedMemory'
        type: array
    type: object
  github_com_Tencent_WeKnora_internal_types.MessageArtifact:
