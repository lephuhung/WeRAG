        type: string
      source_path:
        description: Absolute path inside the sandbox (used for diff)
        type: string
      url:
        description: Storage URL (provider://path); persisted, not sent to client
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.MessageAttachment:
    properties:
      content:
        description: Extracted text content (for small text files)
        type: string
      content_mode:
        description: full, selected_chunks or selected_sections
        type: string
      file_name:
        description: Original filename
        type: string
      file_size:
        description: File size in bytes
        type: integer
      file_type:
        description: File extension (e.g., ".pdf", ".docx")
        type: string
      id:
        description: Temporary document ID for session-scoped uploads
        type: string
      is_truncated:
        description: Whether content was truncated
        type: boolean
      line_count:
        description: Total line count (for text files)
        type: integer
      outline:
        description: |-
          Outline lists the sections of a document too large for the prompt
          (content_mode selected_sections), so the model knows what the parts
          it was given belong to and what else the document holds.
        type: string
      parse_error:
        description: |-
          ParseError is set when the attachment's content could not be made
          available to the model (parse failure, timeout, missing/expired
          document, or content with no readable text). BuildPrompt renders it as
          an explicit failure block so the LLM knows not to fabricate an answer.
        type: string
      selected_chunks:
        description: Chunks included in this message prompt
        type: integer
      token_count:
        description: Approximate tokens in the parsed document
        type: integer
      total_chunks:
        description: Total parsed chunks
        type: integer
    type: object
  github_com_Tencent_WeKnora_internal_types.MessageDocumentSelection:
    properties:
      document:
        description: |-
          Document names that workspace for the model ("vb2 · Tờ trình.docx");
          set by the server after it checked DocumentID, never by the client.
        type: string
      document_id:
        description: |-
          DocumentID is the workspace (editor tab) the text was selected in;
          empty from a client that predates multi-document sessions.
        type: string
      paragraph_hint:
        description: |-
          ParagraphHint is optional surrounding text the editor plugin could
          capture (for example the whole paragraph), used to locate the passage
          when Text alone is ambiguous.
        type: string
      paragraph_occurrence:
        description: |-
          ParagraphOccurrence is the 1-based instance of ParagraphHint (the
          paragraph the selection starts in) among the paragraphs with the same
          normalised text, so a passage repeated elsewhere in the document is
          told apart; 0 when the editor did not say.
        type: integer
      text:
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.MessageImage:
    properties:
      caption:
        type: string
      url:
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.MinIOEngineConfig:
    properties:
      access_key_id:
        type: string
      bucket_name:
        type: string
      endpoint:
        type: string
      mode:
        description: '"docker" or "remote"'
        type: string
      path_prefix:
        type: string
      secret_access_key:
        type: string
      use_ssl:
        type: boolean
    type: object
  github_com_Tencent_WeKnora_internal_types.ModelParameters:
    properties:
      api_key:
        type: string
      app_id:
        description: Thông tin xác thực riêng cho nhà cung cấp WeKnoraCloud
        type: string
      app_secret:
        description: Lưu mã hóa AES-256, thực chất chứa API Key upstream
        type: string
      base_url:
        type: string
      context_window:
        description: |-
          ContextWindow is the model's total context window in tokens and
          MaxOutputTokens the most it emits in one response. Both are provider
          facts the agent cannot discover but has to act on: the context window is
          what decides when conversation history gets compacted, and assuming a
          window larger than the real one means compaction never fires and the
          provider rejects the request mid-conversation instead. 0 means unknown,
          which falls back to DefaultMaxContextTokens.
        type: integer
      custom_headers:
        additionalProperties:
          type: string
        description: |-
          CustomHeaders cho phép đính kèm HTTP header tùy chỉnh khi gọi API mô hình từ xa,
          tương tự tham số extra_headers của Python OpenAI SDK;
          dùng cho các trường hợp như chuyển tiếp thông tin xác thực của gateway doanh nghiệp, trace ID, định tuyến...
          Các header dành riêng (Authorization, api-key, Content-Type, Accept...) bị bỏ qua lúc chạy để không phá vỡ luồng ký/xác thực.
        type: object
      embedding_parameters:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.EmbeddingParameters'
