  internal_handler.createInvitationRequest:
    properties:
      email:
        type: string
      message:
        type: string
      role:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantRole'
    required:
    - email
    - role
    type: object
  internal_handler.createInviteLinkRequest:
    properties:
      message:
        type: string
      role:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantRole'
    required:
    - role
    type: object
  internal_handler.createTenantRequest:
    properties:
      description:
        maxLength: 512
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handler.invitationLookupRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_handler.invitationLookupResponse:
    properties:
      expires_at:
        type: string
      role:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantRole'
      tenant_id:
        type: integer
      tenant_name:
        type: string
    type: object
  internal_handler.meEnvVarRequest:
    properties:
      name:
        type: string
      sandbox_config_id:
        type: string
      skill_id:
        type: string
      value:
        description: |-
          Value is unused by the delete endpoints. Clearing a value is a delete
          rather than a write of "", so a member always has one unambiguous way to
          revoke.
        type: string
    type: object
  internal_handler.messageFeedbackRequest:
    properties:
      comment:
        type: string
      value:
        description: Value is 1 (helpful), -1 (not helpful) or 0 (clear the vote).
        type: integer
    required:
    - value
    type: object
  internal_handler.platformAPIKeyCreateRequest:
    properties:
      capabilities:
        items:
          type: string
        type: array
      expires_at_unix:
        type: integer
      name:
        type: string
    type: object
  internal_handler.registerByInviteRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      token:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - token
    - username
    type: object
  internal_handler.sandboxConfigRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantSandboxConfig'
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_handler.skillPatchRequest:
    properties:
      enabled:
        description: |-
          Enabled is a pointer because its absence is not a request to disable the
          skill; a body may carry envs instead.
        type: boolean
      envs:
        additionalProperties:
          type: string
        description: |-
          Envs is a pointer to a map because "sent an empty object" and "did not
          mention envs" are different requests: the first clears what it names,
          the second must leave every stored value alone.
        type: object
    type: object
  internal_handler.skillSourceRequest:
    properties:
      source:
        description: |-
          Source is exactly one of: "@owner/slug" or a slash-free slug (ClawHub),
          a github.com / gitlab.com / skills.sh / clawhub / skillhub page URL, a
          ClawHub skills-sh catalog page or "skills-sh:owner/repo/slug" locator, or
          a direct zip/SKILL.md URL. Bare "owner/slug" is rejected: it is both a
          ClawHub id and a GitHub repo. The fetch carries no credential.
        type: string
    type: object
  internal_handler.storageBackendRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.StorageBackendConfig'
      name:
        type: string
      provider:
        type: string
      status:
        type: string
    required:
    - name
    - provider
    type: object
  internal_handler.tenantMemberTarget:
    properties:
      email:
        type: string
      new_user:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.AdminCreateUserRequest'
      user_id:
        type: string
    type: object
  internal_handler.updateLastFAQImportResultDisplayStatusRequest:
    properties:
      display_status:
        enum:
        - open
        - close
        type: string
    required:
    - display_status
    type: object
  internal_handler.updateMemberRoleRequest:
    properties:
      role:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.TenantRole'
    required:
    - role
    type: object
  internal_handler.updateMyPreferencesRequest:
    properties:
      browser_search_instructions:
        maxLength: 4000
        type: string
      language:
        description: |-
          Language stores the user's UI locale choice so it follows the account
          across devices. Empty string clears it back to the browser/default
          locale.
        maxLength: 35
        type: string
      last_active_tenant_id:
        description: |-
          LastActiveTenantID lets clients persist "after a fresh login,
          drop me back into this organization" across devices. The SPA sends
          this after every organization switch; POST /auth/switch-tenant records
          the same preference server-side. Send a positive organization id to
          set / replace, or 0 to clear. Membership is validated at next
          login, not here. Nil = field omitted from the PATCH and stays
          untouched.
        type: integer
      province_id:
        type: string
      work_unit:
        type: string
    type: object
  internal_handler.updateMyProfileRequest:
    properties:
      username:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - username
    type: object
  internal_handler.usageSeatRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  internal_handler_session.AttachmentUpload:
    properties:
      data:
        description: Base64-encoded file content
        type: string
      file_name:
        description: Original filename
        type: string
      file_size:
        description: File size in bytes
        type: integer
    type: object
  internal_handler_session.CreateKnowledgeQARequest:
    properties:
      agent_enabled:
        description: Whether agent mode is enabled for this request
        type: boolean
      agent_id:
        description: Selected custom agent ID
        type: string
      attachment_ids:
        description: Pre-uploaded session-scoped document IDs
        items:
          type: string
        type: array
      attachment_uploads:
        description: Attached files (documents, audio, etc.)
        items:
          $ref: '#/definitions/internal_handler_session.AttachmentUpload'
        type: array
      channel:
        description: 'Source channel: "web", "api", "im", etc.'
        type: string
      clarification_request_id:
        description: |-
          ClarificationRequestID resumes a waiting abbreviation clarification
          turn. It is only a pointer: the backend re-validates the stored turn,
          its owner scope and the frozen request snapshot before resuming.
        type: string
      clarification_version:
        description: |-
          ClarificationVersion is the turn version the client saw; a stale value
          fails closed so two replies can never both resume the same turn.
        type: integer
      disable_title:
        description: Whether to disable auto title generation
        type: boolean
      document_selection:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DocumentSelection'
        description: |-
          DocumentSelection is the passage the user highlighted in the embedded
          document editor. Trimmed and capped server-side, then appended to the
          prompt after the attachments.
      document_template_request:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DocumentTemplateRequest'
        description: |-
          DocumentTemplateRequest asks for a new NĐ30 document drafted into an
          empty Word document (the add-in's template flow): the turn is answered
          with the prepare_document_template result, not by the agent.
      images:
        description: Attached images for multimodal chat
        items:
          $ref: '#/definitions/internal_handler_session.ImageAttachment'
        type: array
      knowledge_base_ids:
        description: Selected knowledge base ID for this request
        items:
          type: string
        type: array
      knowledge_ids:
        description: Selected knowledge ID for this request
        items:
          type: string
        type: array
      local_browser_enabled:
        description: Browser source
        type: boolean
      mcp_service_ids:
        description: Per-request MCP services selected via @mention
        items:
          type: string
        type: array
      mentioned_items:
        description: '@mentioned knowledge bases and files'
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text for knowledge base search
        type: string
      question_origin:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.QuestionOrigin'
        description: QuestionOrigin is the knowledge source of a picked suggested
          question.
      recheck_words:
        description: |-
          RecheckWords are words the gate read on its own last time and the
          user rejected ("Không phải?"): the gate asks about them instead. They
          can only add questions, never skip one.
        items:
          type: string
        type: array
      skill_names:
        description: Per-request Skills selected via @mention
        items:
          type: string
        type: array
      suggestion_attribution:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SuggestionAttribution'
      summary_model_id:
        description: Optional summary model ID for this request (overrides session
          default)
        type: string
      tag_ids:
        description: '@mentioned tag IDs (display/debug; scoped via MentionedItems)'
        items:
          type: string
        type: array
      web_search_enabled:
        description: Whether web search is enabled for this request
        type: boolean
    required:
    - query
    type: object
  internal_handler_session.CreateSessionRequest:
    properties:
      description:
        description: Description for the session (optional)
        type: string
      title:
        description: Title for the session (optional)
        type: string
    type: object
  internal_handler_session.ForkSessionRequest:
    properties:
      message_id:
        description: |-
          MessageID is the message to branch at. A user message copies history
          strictly before it (the client prefills that question). An assistant
          message copies history through that answer so the branch continues after it.
        type: string
      title:
        description: Title is optional. Empty falls back to the source title plus
          a suffix.
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.GenerateTitleRequest:
    properties:
      messages:
        description: Messages to use as context for title generation
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.Message'
        type: array
    required:
    - messages
    type: object
  internal_handler_session.ImageAttachment:
    properties:
      caption:
        description: VLM analysis result (context-aware, single call)
        type: string
      data:
        description: base64 data URI from frontend (data:image/png;base64,...)
        type: string
      url:
        description: serving URL after saving to storage
        type: string
    type: object
  internal_handler_session.MentionedItemRequest:
    properties:
      id:
        type: string
      kb_id:
        description: Parent knowledge base for file/tag mentions
        type: string
      kb_name:
        description: Display name for parent KB
        type: string
      kb_type:
        description: '"document" or "faq" (only for kb type)'
        type: string
      name:
        type: string
      service_id:
        description: Parent MCP service for MCP tool mentions
        type: string
      skill_name:
        description: Preloaded agent skill name
        type: string
      type:
        description: '"kb", "file", "tag", "mcp", "skill", "document"'
        type: string
    type: object
  internal_handler_session.SearchKnowledgeRequest:
    properties:
      knowledge_base_id:
        description: Single knowledge base ID (for backward compatibility)
        type: string
      knowledge_base_ids:
        description: IDs of knowledge bases to search (multi-KB support)
        items:
          type: string
        type: array
      knowledge_ids:
        description: IDs of specific knowledge (files) to search
        items:
          type: string
        type: array
      mentioned_items:
        description: Optional scoped tag mentions
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        description: Query text to search for
        type: string
      tag_ids:
        description: Tag IDs for filtering within a single KB
        items:
          type: string
        type: array
    required:
    - query
    type: object
  internal_handler_session.SteerMessageRequest:
    properties:
      channel:
        type: string
      delivery:
        description: Delivery is "after" (default) or "inject". See the constants
          above.
        type: string
      expected_assistant_message_id:
        description: |-
          Optional for older clients. New clients pin delivery to the run they see
          and supply a stable ID so a consume event may precede the HTTP response.
        type: string
      mentioned_items:
        items:
          $ref: '#/definitions/internal_handler_session.MentionedItemRequest'
        type: array
      query:
        type: string
      steer_id:
        type: string
    required:
    - query
    type: object
  internal_handler_session.StopSessionRequest:
    properties:
      message_id:
        type: string
    required:
    - message_id
    type: object
  internal_handler_session.batchDeleteRequest:
    properties:
      delete_all:
        type: boolean
      ids:
        items:
          type: string
        type: array
    type: object
info:
  contact:
    name: WeKnora Github
    url: https://github.com/Tencent/WeKnora
  description: WeKnora Knowledge Base Management System API Documentation
  termsOfService: http://swagger.io/terms/
  title: WeKnora API
  version: "1.0"
paths:
  /abbreviations:
    get:
      description: |-
        Lists dictionary entries, optionally filtered by a substring
        match on short_form/full_form and by active state.
      parameters:
      - description: Substring filter
        in: query
        name: search
        type: string
      - description: Filter by active state
        in: query
        name: is_active
        type: boolean
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Row offset; overrides page
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Rows + total
          schema:
            additionalProperties: true
            type: object
      summary: List abbreviations
      tags:
      - Từ viết tắt
    post:
      description: Creates an inactive suggestion; an admin activates it later.
      responses: {}
      summary: Suggest an abbreviation
  /abbreviations/{id}:
    delete:
      responses: {}
      summary: Delete an abbreviation (admin)
    get:
      responses: {}
      summary: Get one abbreviation
    patch:
      description: Partial update; is_active flips are admin-only by route guard.
      responses: {}
      summary: Update an abbreviation (admin)
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: Hỏi đáp thông minh dựa trên trợ lý, hỗ trợ hội thoại nhiều lượt
        và phản hồi streaming SSE
      parameters:
      - description: ID cuộc trò chuyện
        in: path
        name: session_id
        required: true
        type: string
      - description: Yêu cầu hỏi đáp
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: Dạng tham chiếu tệp; public trả về liên kết tải trực tiếp
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Kết quả hỏi đáp (luồng SSE)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Hỏi đáp với trợ lý
      tags:
      - Hỏi đáp
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: Gọi sau khi người dùng hoàn tất ủy quyền OAuth trong cuộc trò chuyện;
        kiểm tra token tồn tại rồi tiếp tục lượt gọi công cụ của trợ lý đang tạm dừng
      parameters:
      - description: ID chờ ủy quyền
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "409":
          description: người dùng chưa hoàn tất ủy quyền
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Hoàn tất ủy quyền OAuth của MCP trong cuộc trò chuyện
      tags:
      - Dịch vụ MCP
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: Người dùng chủ động bỏ qua ủy quyền OAuth, gỡ chặn cho trợ lý
      parameters:
      - description: ID chờ ủy quyền
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Bỏ qua ủy quyền OAuth của MCP trong cuộc trò chuyện
      tags:
      - Dịch vụ MCP
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: Người dùng phê duyệt hoặc từ chối một lượt gọi công cụ (dùng khi
        trợ lý đang chờ phê duyệt)
      parameters:
      - description: ID bản ghi chờ phê duyệt
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Kết quả phê duyệt
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Không tìm thấy bản ghi chờ phê duyệt
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Xử lý yêu cầu chờ phê duyệt gọi công cụ MCP
      tags:
      - Dịch vụ MCP
  /agents:
    get:
      consumes:
