  github_com_Tencent_WeKnora_internal_types.SessionContextUsage:
    properties:
      compacted:
        description: 'Compacted: the history starts from a summary of earlier turns.'
        type: boolean
      compacted_turns:
        description: CompactedTurns is how many turns of this session the summary
          covers.
        type: integer
      denied:
        description: |-
          Denied: enforcement is on and the caller's package would refuse the
          next turn; DenialReason says why (UsageDenial* reasons:
          no_subscription, expired, no_seat, limit_exhausted).
        type: boolean
      enforced:
        description: |-
          Enforced: the plan's caps apply to this caller (usage.enforce is on
          and the caller is not a SuperAdmin).
        type: boolean
      history_budget:
        description: |-
          HistoryBudget is how much history a turn may carry before older
          turns are summarized: the plan's context.history_tokens clamped, or
          ModelWindow when no cap applies.
        type: integer
      history_rounds:
        description: |-
          HistoryRounds is how many recent rounds a quick-answer turn carries
          (fewer after a summary); 0 in agent mode, which sizes history in
          tokens.
        type: integer
      history_tokens:
        description: |-
          HistoryTokens is the estimated history of the next turn: the summary
          plus the turns after it, priced as the history loader prices them.
        type: integer
      last_turn:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SessionContextLastTurn'
        description: LastTurn is the newest completed turn's usage, nil before any.
      mode:
        description: Mode is the history shape estimated (ContextUsageMode*).
        type: string
      model_window:
        description: ModelWindow is the context window of the session's chat model.
        type: integer
      plan_name:
        description: PlanName is the governing package's name, "" when none applies.
        type: string
      reason:
        type: string
      seeded:
        description: |-
          Seeded: the summary is the one of the session this one continues
          (this session has no compaction of its own yet).
        type: boolean
      session:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.SessionContextSessionStatus'
        description: Session is the session's lifetime usage against the plan's caps.
      summary_tokens:
        description: SummaryTokens is the part of HistoryTokens that is a summary.
        type: integer
      turn_token_cap:
        description: TurnTokenCap is the plan's agent.turn_token_cap, 0 for none.
        type: integer
    type: object
  github_com_Tencent_WeKnora_internal_types.SessionLastRequestState:
