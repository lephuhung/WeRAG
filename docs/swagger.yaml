  internal_handler.apiPrincipalConfigRequest:
    properties:
      direct_header_name:
        type: string
      hmac_secret:
        type: string
      mode:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.APIPrincipalMode'
      require_direct_header:
