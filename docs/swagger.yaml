securityDefinitions:
  ApiKeyAuth:
    description: 'API Key authentication: Organization Key accesses the corresponding
      organization; Platform Key requires X-Tenant-ID header when invoking organization
      APIs'
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 'User login authentication: enter JWT token in Bearer {token} format'
    in: header
    name: Authorization
    type: apiKey
