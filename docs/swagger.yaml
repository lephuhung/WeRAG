        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.DomainPackDocumentView:
    properties:
      articles:
        items:
          type: string
        type: array
      cited_in:
        description: CitedIn lists the pack files citing the number (computed at load).
        items:
          type: string
        type: array
      documents:
        description: Documents are the catalogue rows holding the number (0, 1 or
          more).
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileDocument'
        type: array
      formulas:
        description: Formulas are the ids of the formulas whose basis names the number.
        items:
          type: string
        type: array
      lookup:
        description: Lookup is found, missing or ambiguous; "" when the lookup failed.
        type: string
      number:
        type: string
      title:
        type: string
      used_for:
        type: string
      warning:
        description: |-
          Warning: what the pack says about this document needs checking
          (missing, ambiguous, a status note, no KB holds the text).
        type: boolean
    type: object
  github_com_Tencent_WeKnora_internal_types.DomainPackDraft:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      title:
        type: string
      version:
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.DomainPackFormulaBasis:
    properties:
