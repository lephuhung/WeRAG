  internal_handler.batchReparseKnowledgeRequest:
    properties:
      ids:
        items:
          type: string
        type: array
      kb_id:
        type: string
      process_config:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.KnowledgeProcessOverrides'
    required:
    - ids
    - kb_id
