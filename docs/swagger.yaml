          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email and username refer to conflicting identities
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (SystemAdmin)
      tags:
      - Quản trị hệ thống
  /system/admin/users/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Replace another user's local password and revoke all of their existing sessions (SystemAdmin only).
        A system administrator cannot reset their own password through this endpoint; self-service password change still requires the old password.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request, weak password, or self reset
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Reset another user's password
      tags:
      - Quản trị hệ thống
  /system/capabilities:
    get:
      description: Trả về phiên bản triển khai hiện tại và các năng lực tương ứng
        với route backend đã đăng ký thật; chỉ supported=false mới có nghĩa là nên
        ẩn lối vào
      produces:
      - application/json
      responses:
        "200":
          description: Gói chuẩn code/msg/data, data là DeploymentCapabilitiesData
          schema:
            additionalProperties: true
            type: object
      summary: Lấy danh sách năng lực của bản triển khai
      tags:
      - Hệ thống
  /system/docreader/reconnect:
    post:
      consumes:
      - application/json
      parameters:
      - description: Địa chỉ DocReader
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Kết nối lại dịch vụ phân tích tài liệu
      tags:
      - Hệ thống
  /system/domain-packs:
    get:
      description: |-
        Các bộ kỹ năng chuyên môn có trong bản build: phiên bản, mốc dữ
        liệu, hạn rà soát, số văn bản trích dẫn, số công thức, số
        agent đang dùng (mọi Tổ chức).
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách gói
          schema:
            items:
              $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackSummary'
            type: array
      security:
      - Bearer: []
      summary: Danh sách bộ kỹ năng chuyên môn (SuperAdmin)
      tags:
      - Rà soát pháp lý
  /system/domain-packs/{name}:
    get:
      description: |-
        Văn bản trích dẫn (tra danh mục chỉ đọc: trạng thái, có
        trong KB, ghi chú hiệu lực, tệp trích, công thức dùng),
        công thức (căn cứ ok/warning), agent đang dùng. Không ghi
        yêu cầu nào; POST …/reconcile mới ghi.
      parameters:
      - description: Tên bộ kỹ năng (domain pack)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chi tiết gói
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackDetail'
      security:
      - Bearer: []
      summary: Chi tiết bộ kỹ năng chuyên môn (SuperAdmin)
      tags:
      - Rà soát pháp lý
  /system/domain-packs/{name}/reconcile:
    post:
      description: |-
        Tra từng số hiệu trong catalogue.yaml của gói theo
        legal_documents.number_key: found (một văn bản, kèm
        status_note khi danh mục ghi hết hiệu lực hoặc bị thay thế),
        missing (không có; ghi một yêu cầu bổ sung văn bản nguồn
        detail.origin = pack:<tên gói>, không trùng yêu cầu đã có) hoặc ambiguous
        (nhiều văn bản cùng số hiệu). Không sửa legal_documents.
      parameters:
      - description: Tên bộ kỹ năng (domain pack)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kết quả đối chiếu
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileResult'
      security:
      - Bearer: []
      summary: Đối chiếu danh mục của bộ kỹ năng chuyên môn
      tags:
      - Rà soát pháp lý
  /system/info:
    get:
      consumes:
      - application/json
      description: Lấy phiên bản hệ thống, thông tin bản dựng và cấu hình engine
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin hệ thống
          schema:
            $ref: '#/definitions/internal_handler.GetSystemInfoResponse'
      summary: Lấy thông tin hệ thống
      tags:
      - Hệ thống
  /system/legal-catalog/search:
    get:
      description: |-
        Finds catalogue documents by số hiệu or title words so a
        reviewer can link a document by hand.
      parameters:
      - description: Number or title words
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Documents
          schema:
            additionalProperties: true
            type: object
      summary: Search the legal catalogue
      tags:
      - Rà soát pháp lý
  /system/legal-drafts:
    get:
      description: |-
        status is fetching, ocr, ready, reviewing, approved, failed
        or all (default); newest change first, without OCR text.
      parameters:
      - description: Draft status or all
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Items and total
          schema:
            additionalProperties: true
            type: object
      summary: List OCR drafts
      tags:
      - Rà soát pháp lý
  /system/legal-drafts/{id}:
    delete:
      description: |-
        Deletes a draft that was not approved (the PDF stays
        stored); its requests go back to "requested".
      parameters:
      - description: Draft ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      summary: Discard an OCR draft
      tags:
      - Rà soát pháp lý
    get:
      parameters:
      - description: Draft ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The draft
          schema:
            additionalProperties: true
            type: object
      summary: One OCR draft with its raw OCR text and request
      tags:
      - Rà soát pháp lý
  /system/legal-drafts/{id}/approve:
    post:
      consumes:
      - application/json
      description: |-
        Converts the draft's current text to vbpl-style HTML (prov-*
        markup), checks it with the vbpl converter and ingests it into
        the public knowledge base like a portal page
        (source_format pdf_reviewed). 400 when the structure check
        still blocks or the converter reads another article count.
      parameters:
      - description: Draft ID
        in: path
        name: id
        required: true
        type: string
      - description: Target knowledge base
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ApproveLegalDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: draft, request, result, knowledge_id, articles
          schema:
            additionalProperties: true
            type: object
      summary: Approve a reviewed draft and ingest it
      tags:
      - Rà soát pháp lý
  /system/legal-drafts/{id}/open:
    post:
      description: |-
        The first call builds the draft's .docx and opens it in a
        hidden document-assistant session of the platform
        organization owned by the caller; later calls return the same
        ids. The session routes (/sessions/{session_id}/documents/
        {document_id}/...) are called with X-Tenant-ID = tenant_id.
      parameters:
      - description: Draft ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: draft, editor, session_id, document_id, tenant_id, pdf_url
          schema:
            additionalProperties: true
            type: object
      summary: Open an OCR draft in the editor
      tags:
      - Rà soát pháp lý
  /system/legal-drafts/{id}/structure:
    get:
      description: |-
        Saves the open editor, reads the draft's current text and
        reports its Phần/Chương/Mục/Điều tree, articles, khoản/điểm
        counts and warnings; ready_to_approve is false while a
        blocking warning remains.
      parameters:
      - description: Draft ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Structure report
          schema:
            additionalProperties: true
            type: object
      summary: Check the legal structure of a draft
      tags:
      - Rà soát pháp lý
  /system/legal-requests:
    get:
      description: |-
        Pages the requests to add legal documents, most recently
        requested first. status is requested (default), fetched,
        reviewing, added, rejected or all; counts holds the total per
        status; an item's draft is the OCR draft of a scanned PDF.
      parameters:
      - description: requested, fetched, reviewing, added, rejected or all
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Items, total and counts
          schema:
            additionalProperties: true
            type: object
      summary: List legal document requests
      tags:
      - Rà soát pháp lý
  /system/legal-requests/{id}:
    put:
      consumes:
      - application/json
      description: |-
        action "ingest" fetches the document's HTML full text from
        vbpl.vn into the public knowledge base knowledge_base_id (same
        code as the MCP tool legal_ingest_document); a document vbpl.vn
        has only as a scanned PDF answers 400 (it goes through a
        reviewed OCR draft: POST /system/legal-requests/{id}/fetch) and
        its portal availability is stored as detail.portal; "reject" keeps note as the
        reason users see; "added" records a document added by hand.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.LegalRequestDecision'
      produces:
      - application/json
      responses:
        "200":
          description: Updated item
          schema:
            additionalProperties: true
            type: object
      summary: Ingest, reject or close a legal document request
      tags:
      - Rà soát pháp lý
  /system/legal-requests/{id}/fetch:
    post:
      description: |-
        For a document vbpl.vn has only as a scanned PDF: downloads
        the PDF and OCRs it into a draft (up to 20 pages while the
        request waits, longer scans in the background: status "ocr").
        An existing draft is returned as it is; a failed one is
        fetched again. 400 when vbpl.vn has the HTML full text (ingest
        it directly) or no full text at all.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The draft
          schema:
            additionalProperties: true
            type: object
      summary: Fetch a request's scanned PDF into an OCR draft
      tags:
      - Rà soát pháp lý
  /system/legal-requests/{id}/portal-check:
    post:
      description: |-
        Reads the document's portal page (no download) and stores
        detail.portal = {checked_at, status, html, pdf_file, exists}
        on the request: HTML full text, only an original PDF scan,
        or nothing.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Updated item
          schema:
            additionalProperties: true
            type: object
      summary: Check what vbpl.vn offers for a requested document
      tags:
      - Rà soát pháp lý
  /system/legal-requests/public-knowledge-bases:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: '[{id, name}]'
          schema:
            additionalProperties: true
            type: object
      summary: Public knowledge bases a request can be ingested into
      tags:
      - Rà soát pháp lý
  /system/legal-reviews:
    get:
      description: |-
        Pages the review queue of public-KB documents. status is
        pending, approved, rejected, alerts (approved documents a
        newer one supersedes) or empty for all.
      parameters:
      - description: Review status or alerts
        in: query
        name: status
        type: string
      - description: Only this KB
        in: query
        name: knowledge_base_id
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Items + total
          schema:
            additionalProperties: true
            type: object
      summary: List legal identity reviews
      tags:
      - Rà soát pháp lý
  /system/legal-reviews/{knowledge_id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Knowledge ID
        in: path
        name: knowledge_id
        required: true
        type: string
      - description: Decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.LegalReviewDecision'
      produces:
      - application/json
      responses:
        "200":
          description: Updated item
          schema:
            additionalProperties: true
            type: object
      summary: Approve or reject a document's legal identity
      tags:
      - Rà soát pháp lý
  /system/legal-reviews/{knowledge_id}/spellcheck:
    post:
      consumes:
      - application/json
      description: |-
        Checks Vietnamese spelling of the given chunk texts (as the
        reviewer has them, saved or not) with the KB's summary
        model. Nothing is saved; at most 40 chunks per call.
      parameters:
      - description: Knowledge ID
        in: path
        name: knowledge_id
        required: true
        type: string
      - description: '{items: [{chunk_id, content}]}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Findings
          schema:
            additionalProperties: true
            type: object
      summary: Proofread chunks of a reviewed document
      tags:
      - Rà soát pháp lý
  /system/legal-reviews/scan:
    post:
      description: |-
        Reads the header of every parsed public-KB document without
        a review yet and stores a pending suggestion matched against
        the legal catalogue.
      produces:
      - application/json
      responses:
        "200":
          description: created count
          schema:
            additionalProperties: true
            type: object
      summary: Suggest legal identities for new public-KB documents
      tags:
      - Rà soát pháp lý
  /system/parse-defaults:
    get:
      description: |-
        Returns the knowledge.parse_defaults document
        ({"enabled": bool, ...process_config fields}). Member-readable
        so upload UIs can skip the parse-settings dialog when the
        SystemAdmin has locked a default configuration; absent rows
        resolve to enabled=false.
      produces:
      - application/json
      responses:
        "200":
          description: '{ success, data: SystemParseDefaults }'
          schema:
            additionalProperties: true
            type: object
      summary: Get the platform-wide default parse settings
      tags:
      - Hệ thống
  /system/parser-engines:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách engine phân tích
          schema:
            additionalProperties: true
            type: object
      summary: Liệt kê các engine phân tích tài liệu khả dụng
      tags:
      - Hệ thống
  /system/parser-engines/check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Cấu hình engine phân tích (cùng cấu trúc với API lưu)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Kiểm tra engine phân tích khả dụng với tham số hiện tại
      tags:
      - Hệ thống
  /system/sandbox-check:
    post:
      consumes:
      - application/json
      description: Kiểm tra backend sandbox bằng tham số đang nhập, không lưu cấu
        hình; deep=true sẽ chạy một script tạm, backend từ xa còn tạo rồi huỷ một
        sandbox
      parameters:
      - description: cấu hình sandbox
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SandboxCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SandboxCheckResponse'
      summary: Kiểm tra kết nối sandbox
      tags:
      - Hệ thống
  /system/storage-engine-check:
    post:
      consumes:
      - application/json
      description: Dùng tham số đang điền để kiểm tra kết nối MinIO, không lưu cấu
        hình
      parameters:
      - description: Cấu hình engine lưu trữ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.StorageCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.StorageCheckResponse'
      summary: Kiểm tra kết nối engine lưu trữ
      tags:
      - Hệ thống
  /system/storage-engine-status:
    get:
      description: Trả về trạng thái khả dụng và mô tả của các engine lưu trữ Local,
        MinIO để thiết lập toàn cục và kho tri thức lựa chọn
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.GetStorageEngineStatusResponse'
      summary: Lấy trạng thái engine lưu trữ
      tags:
      - Hệ thống
  /system/ui-theme:
    get:
      description: |-
        Returns {"theme": "elevenlabs"|"anthropic"} via the 3-tier
        system-setting resolver. Public (no auth) so the login page
        and the Word add-in apply the same theme.
      produces:
      - application/json
      responses:
        "200":
          description: '{ success, data: { theme } }'
          schema:
            additionalProperties: true
            type: object
      summary: Get the platform-wide UI theme
      tags:
      - Hệ thống
  /tenants:
    get:
      consumes:
      - application/json
      description: Lấy danh sách tổ chức người dùng hiện tại truy cập được
      produces:
      - application/json
      responses:
        "200":
          description: Organization list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Lấy danh sách tổ chức
      tags:
      - Tổ chức
    post:
      consumes:
      - application/json
      description: |-
        Tạo tổ chức mới. Mọi người dùng đã đăng nhập đều có thể gọi để lập tổ chức mới của mình,
        người gọi tự động trở thành Owner của tổ chức đó. Siêu quản trị liên tổ chức vẫn có thể
        tạo tổ chức bất kỳ qua endpoint này như trước.
        Khi tenant.auto_create_api_key (hoặc WEKNORA_TENANT_AUTO_CREATE_API_KEY)
        được bật, hệ thống tự tạo một API Key full_access và trả token dạng rõ trong trường data.api_key của phản hồi.
      parameters:
      - description: Thông tin tổ chức
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tổ chức đã tạo (có thể kèm api_key)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Create organization
      tags:
      - Tổ chức
  /tenants/{id}:
    delete:
      consumes:
      - application/json
      description: Xoá tổ chức chỉ định
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Xoá thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Delete organization
      tags:
      - Tổ chức
    get:
      consumes:
      - application/json
      description: Lấy chi tiết tổ chức theo ID
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Organization details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tham số không hợp lệ
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "404":
          description: Không tìm thấy tổ chức
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Lấy chi tiết tổ chức
      tags:
      - Tổ chức
    put:
