      asr_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.ASRConfig'
        description: ASR config (Automatic Speech Recognition)
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.AutoTagConfig'
        description: AutoTagConfig controls asynchronous association of existing tags
          after parsing.
      chunk_count:
        description: Chunk count (not stored in database, calculated on query)
        type: integer
      chunking_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.ChunkingConfig'
        description: Chunking configuration
      created_at:
        description: Creation time of the knowledge base
        type: string
      creator_id:
        description: |-
          CreatorID records the user ID of whoever originally created the KB.
          Used by the organization-level RBAC middleware to let Contributors edit
          their own KBs without granting them access to everyone else's.
          Nullable for backward compatibility with rows created before the
          RBAC migration backfilled the column to the organization Owner.
        type: string
      creator_name:
        description: |-
          CreatorName là tên hiển thị của người dùng ứng với CreatorID (username / email...),
          chỉ được handler điền hàng loạt khi liệt kê, không lưu DB; rỗng nghĩa là không xác định được người tạo (người dùng đã bị xóa,
          dữ liệu cũ không có CreatorID...). Frontend dùng nó để phân biệt mine / organization trên huy hiệu nguồn của thẻ.
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Deletion time of the knowledge base
      description:
        description: Description of the knowledge base
        type: string
      embedding_model_id:
        description: ID of the embedding model
        type: string
      extract_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.ExtractConfig'
        description: Extract config
      faq_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.FAQConfig'
        description: FAQConfig stores FAQ specific configuration such as indexing
          strategy
      generated_profile:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.KnowledgeBaseProfile'
        description: |-
          GeneratedProfile is the machine-generated description: a gist, merged
          topics, typical questions and the aggregate snapshot they came from. It
          never overwrites the user-authored Description; both are shown to agents.
      id:
        description: Unique identifier of the knowledge base
        type: string
      image_processing_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.ImageProcessingConfig'
        description: Image processing configuration
      indexing_strategy:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.IndexingStrategy'
        description: |-
          IndexingStrategy controls which indexing pipelines are active for this knowledge base.
          Pipelines: vector search, keyword search, wiki generation, knowledge graph extraction.
      is_pinned:
        description: |-
          IsPinned and PinnedAt are computed per-caller from user_kb_pins
          (see migration 000050). They used to be stored on the row itself,
          which made pinning an organization-wide ordering decision gated behind
          the kb-edit RBAC guard. The columns are still present in legacy
          schemas for rollback safety but are no longer read or written by
          the application — both fields are tagged `gorm:"-"` so GORM
          ignores them on every CRUD call and the list handler stamps them
          after enriching with the caller's pin set.
        type: boolean
      is_processing:
        description: IsProcessing indicates if there is a processing import task (for
          FAQ type knowledge bases)
        type: boolean
      is_temporary:
        description: Whether this knowledge base is temporary (ephemeral) and should
          be hidden from UI
        type: boolean
      knowledge_count:
        description: Knowledge count (not stored in database, calculated on query)
        type: integer
      member_default:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.KBMemberDefault'
        description: |-
          MemberDefault decides what active members of the owner organization may do
          on a 'tenant'-visibility KB: 'view' or 'contribute' (migration 000148).
      name:
        description: Name of the knowledge base
        type: string
      owner_tenant_id:
        description: |-
          OwnerTenantID is the authorization owner of this knowledge base:
          a nonzero organization ID means organization-owned, 0 means platform-owned
          (no organization owner). TenantID above stays the immutable
          data-scope/execution partition for documents and indexes and is
          never rewritten by a public/tenant scope transition. Rows
          predating migration 000113 backfill this column from tenant_id.
          The owner/visibility invariant (public <=> owner 0, tenant <=>
          owner > 0) is enforced by migration 000113's CHECK constraint on
          PostgreSQL and by ValidateOwnership in Go (SQLite/test path).
        type: integer
      owner_tenant_name:
        description: |-
          OwnerTenantName is the owning organization's display name, filled on
          published-catalog rows so readers see which unit published them.
        type: string
      pinned_at:
        description: |-
          PinnedAt records when the current caller pinned this knowledge
          base; nil when they have not.
        type: string
      processing_count:
        description: ProcessingCount indicates the number of knowledge items being
          processed (for document type knowledge bases)
        type: integer
      profile_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.KnowledgeBaseProfileConfig'
        description: |-
          ProfileConfig controls automatic generation of the knowledge-base
          description from per-document profiles (document knowledge bases only).
      question_generation_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.QuestionGenerationConfig'
        description: QuestionGenerationConfig stores question generation configuration
          for document knowledge bases
      share_count:
        description: ShareCount indicates the number of live organization access grants
          on this knowledge base (not stored in database)
        type: integer
      storage_backend_id:
        description: |-
          StorageBackendID binds this KB to one concrete storage instance. The
          legacy provider field remains readable during migration only.
        type: string
      storage_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.StorageConfig'
        description: 'Deprecated: legacy COS config column. Kept for backward compatibility
          with old data.'
      storage_provider_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.StorageProviderConfig'
        description: 'Storage provider config (new): only stores provider selection;
          credentials from organization StorageEngineConfig'
      subscribed_by_me:
        description: |-
          SubscribedByMe / SubscribedByTenant are computed per caller for
          published KBs: whether the caller, or their whole organization, has put
          the KB into the default retrieval scope.
        type: boolean
      subscribed_by_tenant:
        type: boolean
      summary_model_id:
        description: Summary model ID
        type: string
      tenant_id:
        description: Organization ID
        type: integer
      type:
        description: Type of the knowledge base (document, faq, etc.)
        type: string
      updated_at:
        description: Last updated time of the knowledge base
        type: string
      vector_store_id:
        description: |-
          VectorStoreID references the VectorStore this knowledge base is bound to.
          When nil, the KB falls back to the organization's effective engines derived from
          the RETRIEVE_DRIVER environment variable (env store flow).
          This field is set once at creation time and must not be modified afterwards;
          enforcement lives at the GORM layer (`<-:create`) plus the service-layer
          KB update path, which omits this field from its update DTO.
        type: string
      visibility:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.KBVisibility'
        description: |-
          Visibility controls the read/search scope of this knowledge base.
          See KBVisibility constants. Rows predating migration 000107 read
          back as 'tenant' via the column default.
      vlm_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.VLMConfig'
        description: VLM config
      wiki_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.WikiConfig'
        description: WikiConfig stores wiki-specific configuration (only for wiki
          type knowledge bases)
    type: object
  github_com_Tencent_WeKnora_internal_types.KnowledgeBaseConfig:
    properties:
      auto_tag_config:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.AutoTagConfig'
