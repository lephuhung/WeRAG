  github_com_Tencent_WeKnora_internal_types.UserPreferences:
    properties:
      browser_search_instructions:
        description: BrowserSearchInstructions customizes browser search for this
          user. Nil/empty uses the platform default.
        type: string
      language:
        description: |-
          Language is the UI locale this user last picked (e.g. "en", "vi").
          Persisted so the choice follows the account across browsers and
          devices instead of living in one browser's localStorage.
        type: string
      last_active_tenant_id:
        description: |-
          LastActiveTenantID remembers the last organization the user actively
          switched into, so a fresh login (new device, cleared browser, new
          refresh token) lands them back in that organization instead of always
          bouncing to their home organization. Written by the SPA's preferences
          PUT and by service-level SwitchTenant (including when switching
          home, which stores the home ID). Login / RefreshToken validate that
          the organization still exists and the user still has an active membership
          (or is a SuperAdmin) before honouring this preference; an
          invalid pointer is best-effort cleared and the user falls back to
          home. Refresh JWT claims have no tenant_id, so RefreshToken
          re-resolves from this field.

          nil  = no preference (use user.TenantID, i.e. home)
          *0   = "clear preference" sentinel for the partial-update endpoint
                 (UpdateUserPreferences turns this into nil). Otherwise treat
                 a stored *0 the same as nil.
          *N   = preferred organization id.
        type: integer
      oidc_only_login:
        description: |-
          OidcOnlyLogin is set server-side when an account is auto-provisioned
          via OIDC with a random password the user never received. The profile
          UI hides self-service password rotation until the user sets a known
          password via ChangePassword (which clears this flag).
        type: boolean
      province_id:
        type: string
      work_unit:
        description: |-
          WorkUnit is the user's agency or unit (đơn vị công tác), free text.
          ProvinceID is the vbpl.vn unit ID of their province (types.Provinces).
          Both reach the assistant as user context; the province is the default
          for local document numbers every province reuses. "" clears.
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.VLMConfig:
    properties:
      api_key:
        description: API Key
        type: string
      base_url:
        description: Base URL
        type: string
      custom_instructions:
        description: |-
          CustomInstructions adds KB-specific image interpretation guidance without
          replacing the system-owned OCR and Markdown output contract.
        type: string
      description_language:
        description: |-
          DescriptionLanguage controls the language used for generated image
          captions. Empty means follow the document/request language.
        type: string
      enabled:
        type: boolean
      interface_type:
        description: 'Interface Type: "ollama" or "openai"'
        type: string
      model_id:
        type: string
      model_name:
        description: |-
          Tương thích phiên bản cũ
          Model Name
        type: string
      ocr_only:
        description: |-
          OCROnly restricts image understanding to text extraction: the caption
          (visual description) call is skipped, so each image costs one VLM call
          and yields at most one ImageOCR chunk. Meant for OCR-only endpoints
          such as senocr-vi, where a "describe this image" prompt would simply
          return the OCR text a second time.
        type: boolean
    type: object
  github_com_Tencent_WeKnora_internal_types.VolumeMountConfig:
    properties:
      enabled:
        description: Enabled toggles the volume mount for this organization.
        type: boolean
      mount_path:
        description: |-
          MountPath is the sandbox-internal path where the volume is mounted.
          Default: /weknora/tenant/skills (customizable per use case).
        type: string
      provider:
        description: Provider identifies the volume backend. Currently "e2b" or "cube".
        type: string
      volume_id:
        description: |-
          VolumeID is the provider-specific volume identifier, populated after
          EnsureVolume / CreateVolume succeeds.
        type: string
      volume_name:
        description: |-
          VolumeName is the human-readable volume name, e.g.
          "weknora-tenant-<id>-skills".
        type: string
      volume_owner_fingerprint:
        description: |-
          VolumeOwnerFingerprint = sha256(provider + APIKey + APIURL).
          Used to detect when the organization switched to a different backend or
          API key, at which point the volume is no longer reachable and must
          be recreated.
        type: string
    type: object
