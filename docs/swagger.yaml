  github_com_Tencent_WeKnora_internal_types.LoginResponse:
    properties:
      active_tenant:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.Tenant'
        description: |-
          ActiveTenant is the organization whose ID is encoded in the issued JWT;
          future requests are scoped to it until the client calls /auth/switch-tenant.
          Defaults to the user's home organization on a fresh login.
      memberships:
        description: |-
          Memberships lists every organization the user can authenticate into,
          along with their role in each. Always populated (length 1 for users
          who only belong to their home organization) so frontends can render an
          organization switcher without a follow-up request. Serialised without
          omitempty so the field is always present as a JSON array (possibly
          empty) — the "always populated" contract relies on the server side
          guaranteeing a non-nil slice.
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.Membership'
        type: array
      message:
        type: string
      refresh_token:
        type: string
      success:
        type: boolean
      token:
        type: string
      two_factor_required:
        description: |-
          TwoFactorRequired is true when the credentials were correct but the
          account has 2FA enabled and no/invalid code was supplied. The
          frontend must prompt for a 6-digit code and retry with
          two_factor_code set. No tokens are issued in that response.
        type: boolean
      user:
        $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.User'
    type: object
  github_com_Tencent_WeKnora_internal_types.MCPAdvancedConfig:
    properties:
      retry_count:
        description: 'Number of retries, default: 3'
        type: integer
      retry_delay:
        description: 'Delay between retries in seconds, default: 1'
        type: integer
      timeout:
        description: 'Timeout in seconds, default: 30'
        type: integer
    type: object
  github_com_Tencent_WeKnora_internal_types.MCPAuthConfig:
    properties:
      api_key:
        type: string
      api_key_header:
        description: |-
          APIKeyHeader is the header name that carries APIKey when AuthType is
          api_key. Empty defaults to "X-API-Key". This is non-secret structural
          config (the secret is APIKey), so it is not encrypted and is safe to echo
          back in responses. It lets services that expect the key in a different
          header (e.g. the raw token directly in "Authorization") work without
          resorting to plaintext custom headers.
        type: string
      auth_server_metadata_url:
        description: |-
          AuthServerMetadataURL optionally pins the OAuth authorization server
          metadata URL. When empty, the server is discovered automatically from
          the MCP URL (RFC 9728 / RFC 8414).
        type: string
      auth_type:
        allOf:
        - $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.MCPAuthType'
        description: |-
          AuthType selects the authentication strategy. Empty ("") is treated as
          none for backward compatibility with rows that pre-date this field.
      custom_headers:
        additionalProperties:
          type: string
        type: object
      scopes:
        description: Scopes are the OAuth scopes requested during authorization. Optional.
        items:
          type: string
        type: array
      token:
        type: string
    type: object
