  github_com_Tencent_WeKnora_internal_types.DomainPackReconcileRequest:
    properties:
      created:
        description: |-
          Created is true when this reconcile recorded it, false when an
          existing one (any status) was found and left as it was.
        type: boolean
      id:
        type: string
      status:
        type: string
    type: object
  github_com_Tencent_WeKnora_internal_types.DomainPackReconcileResult:
    properties:
      ambiguous:
        description: |-
          Ambiguous: several catalogue rows share the number (số hiệu is not
          unique); the SuperAdmin decides which one the pack means.
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileAmbiguous'
        type: array
      errors:
        description: |-
          Errors lists the numbers whose check failed; the others are still
          reported, so one bad row does not hide the rest.
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileError'
        type: array
      found:
        description: 'Found: exactly one catalogue row has the number.'
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileFound'
        type: array
      missing:
        description: |-
          Missing: no catalogue row has it; a legal document request was
          recorded (or an existing one is reported).
        items:
          $ref: '#/definitions/github_com_Tencent_WeKnora_internal_types.DomainPackReconcileMissing'
        type: array
      pack:
        type: string
      version:
        type: string
    type: object
