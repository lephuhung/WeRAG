      tags:
      - Lưu trữ
    post:
      consumes:
      - application/json
      description: Register a new object/file storage instance for the current organization.
        The configuration is validated and a connectivity test is run before the backend
        is persisted.
      parameters:
      - description: Storage backend configuration
        in: body
        name: request
        required: true
        schema:
