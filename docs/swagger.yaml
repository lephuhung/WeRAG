        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: A storage backend with this name already exists
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create storage backend
      tags:
      - Lưu trữ
  /storage-backends/{id}:
    delete:
      description: Soft-delete a storage backend. A backend that is the organization
        default, still bound to knowledge bases, environment-sourced, or a legacy
        alias cannot be deleted.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Backend is default, bound, read-only, or legacy alias
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete storage backend
      tags:
      - Lưu trữ
    get:
      description: Retrieve a single storage backend by ID for the current organization.
        Credentials are masked.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Storage backend details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get storage backend
      tags:
      - Lưu trữ
    put:
      consumes:
      - application/json
      description: Update a storage backend's mutable fields (name, credentials, status).
        Provider and physical location (endpoint, region, bucket, path prefix) are
        immutable; use storage migration to move data. Environment-sourced backends
        are read-only. Redacted secret placeholders preserve the stored credentials.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated storage backend fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated storage backend
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Immutable field change, read-only backend, validation, or connectivity
            failure
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_Tencent_WeKnora_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update storage backend
      tags:
      - Lưu trữ
