# Front door of the frontend image: pages go to the Next.js server running in
# the same container, API traffic goes straight to the Go backend (SSE,
# websockets and upload limits need nginx, not the Next rewrite proxy).
# Rendered by docker-entrypoint.sh with envsubst.

upstream werag_next {
    server 127.0.0.1:${NEXT_PORT};
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Embed widget loader: third-party pages include it with <script src>.
    location = /weknora-widget.js {
        proxy_pass http://werag_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Embed pages are framed by third-party sites, so they skip the global
    # X-Frame-Options and get the channel's frame-ancestors CSP from the
    # backend instead (fail-closed: no policy, no page).
    location ^~ /embed/ {
        auth_request /_embed-frame-policy;
        auth_request_set $embed_frame_csp $upstream_http_content_security_policy;
        proxy_pass http://werag_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $embed_frame_csp always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /_embed-frame-policy {
        internal;
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/v1/embed-frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Page-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
        proxy_cache off;
    }

    # Hashed build assets never change for a given URL.
    location ^~ /_next/static/ {
        proxy_pass http://werag_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://werag_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
    }

    # Speech-to-text (sherpa-asr): microphone dictation websocket and file
    # transcription. Resolved per request so nginx still starts when the
    # optional service is not deployed (requests then fail with 502).
    location ^~ /asr/ {
        resolver ${DNS_RESOLVER} valid=30s ipv6=off;
        set $asr_upstream ${ASR_URL};
        rewrite ^/asr/(.*)$ /$1 break;
        proxy_pass $asr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
    }

    # ONLYOFFICE Document Server under a sub-path, so the editor shares the
    # site's origin and certificate. DS builds its own links from
    # X-Forwarded-Host, hence the "/onlyoffice" suffix. Resolved per request
    # like /asr/ so nginx starts without the optional service.
    location ^~ /onlyoffice/ {
        resolver ${DNS_RESOLVER} valid=30s ipv6=off;
        set $onlyoffice_upstream ${ONLYOFFICE_URL};
        rewrite ^/onlyoffice/(.*)$ /$1 break;
        proxy_pass $onlyoffice_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size ${MAX_FILE_SIZE};
    }

    # Word add-in build (werag-word-addin dist/, mounted read-only). Office on
    # the web frames the task pane from its own origin, so this location sets
    # its headers without the site-wide X-Frame-Options.
    location ^~ /word/ {
        alias /srv/werag-word-addin/;
        try_files $uri $uri/ /word/index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /word/index.html {
        alias /srv/werag-word-addin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
    }

    location ^~ /files/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
    }

    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
    }

    # Local browser extension bridge (websocket; tickets ride in the query).
    location = /api/v1/local-browser/extension {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # Backend-internal endpoint; never reachable from outside.
    location = /api/v1/local-browser/internal {
        return 404;
    }

    # Sandbox terminal/desktop websockets (tickets in the query string).
    location ~ ^/api/v1/sessions/[^/]+/sandbox/(terminal|desktop)$ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $werag_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # Skill bundle uploads get their own, larger body limit; everything else
    # keeps MAX_FILE_SIZE.
    location ~ ^/api/v1/(?:skills/catalog|sandbox-configs/[^/]+/skills)/?$ {
        client_max_body_size ${MAX_SKILL_BUNDLE_SIZE};
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        include /etc/nginx/api-proxy.conf;
    }
}
